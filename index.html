<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>তথ্য সংগ্রহ - ইবনে তাইমিয়া স্কুল এন্ড কলেজ</title>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Hind Siliguri', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0d3b66 0%, #0077b6 100%);
            min-height: 100vh;
            padding: 30px 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .form-container {
            width: 100%;
            max-width: 700px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            border-top: 6px solid #ffb703;
        }

        .form-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .form-header h2 {
            color: #0d3b66;
            font-size: 1.8rem;
            margin-bottom: 5px;
        }

        .form-header p {
            color: #0077b6;
            font-size: 1.1rem;
            font-weight: 600;
            background: rgba(0, 119, 182, 0.1);
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
        }

        .grid-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            color: #1e293b;
            font-size: 0.95rem;
        }

        label i {
            color: #0077b6;
            margin-right: 5px;
        }

        input[type="text"],
        input[type="date"],
        input[type="tel"],
        select,
        textarea {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 0.95rem;
            outline: none;
            background: #f8fafc;
            color: #334155;
            transition: all 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #0077b6;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(0, 119, 182, 0.15);
        }

        textarea {
            resize: vertical;
            height: 80px;
        }

        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #0d3b66, #0077b6);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 119, 182, 0.3);
            margin-top: 10px;
        }

        .submit-btn:hover {
            background: linear-gradient(135deg, #005f92, #004d73);
            transform: translateY(-2px);
        }

        @media (max-width: 600px) {
            .grid-row {
                grid-template-columns: 1fr;
            }
            .form-group.full-width {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>

    <div class="form-container">
        <div class="form-header">
            <h2>ইবনে তাইমিয়া স্কুল এন্ড কলেজ</h2>
            <p><i class="fa-solid fa-id-card"></i> তথ্য সংগ্রহ (জবা শিফট - শিক্ষকবৃন্দ)</p>
        </div>

        <form id="teacherForm">
            <div class="grid-row">
                <!-- নাম -->
                <div class="form-group">
                    <label><i class="fa-solid fa-user"></i> শিক্ষকের নাম</label>
                    <input type="text" name="name" placeholder="পূর্ণ নাম লিখুন" required>
                </div>

                <!-- পিতার নাম -->
                <div class="form-group">
                    <label><i class="fa-solid fa-user-shield"></i> পিতার নাম</label>
                    <input type="text" name="fathername" placeholder="পিতার নাম লিখুন" required>
                </div>

                <!-- জন্মতারিখ -->
                <div class="form-group">
                    <label><i class="fa-solid fa-calendar-days"></i> জন্মতারিখ</label>
                    <input type="date" name="dob" required>
                </div>

                <!-- জয়েনিং ডেইট -->
                <div class="form-group">
                    <label><i class="fa-solid fa-briefcase"></i> যোগদানের তারিখ (Joining Date)</label>
                    <input type="date" name="joiningdate" required>
                </div>

                <!-- ডিপার্টমেন্ট -->
                <div class="form-group">
                    <label><i class="fa-solid fa-building-columns"></i> ডিপার্টমেন্ট / বিষয়</label>
                    <input type="text" name="department" placeholder="যেমন: আইসিটি / গণিত" required>
                </div>

                <!-- WhatsApp Number -->
                <div class="form-group">
                    <label><i class="fa-brands fa-whatsapp"></i> WhatsApp নম্বর</label>
                    <input type="tel" name="whatsapp" placeholder="যেমন: 017xxxxxxxx" required>
                </div>

                <!-- শ্রেণি শিক্ষক -->
                <div class="form-group">
                    <label><i class="fa-solid fa-chalkboard-user"></i> শ্রেণি শিক্ষক</label>
                    <select name="classteacher" required>
                        <option value="">-- নির্বাচন করুন --</option>
                        <option value="৬ষ্ঠ শ্রেণি">৬ষ্ঠ শ্রেণি</option>
                        <option value="৭ম শ্রেণি">৭ম শ্রেণি</option>
                        <option value="৮ম শ্রেণি">৮ম শ্রেণি</option>
                        <option value="৯ম শ্রেণি">৯ম শ্রেণি</option>
                        <option value="১০ম শ্রেণি">১০ম শ্রেণি</option>
                        <option value="প্রযোজ্য নয়">প্রযোজ্য নয়</option>
                    </select>
                </div>

                <!-- ছবি (লিংক) -->
                <div class="form-group">
                    <label><i class="fa-solid fa-image"></i> ছবির লিংক (Image URL)</label>
                    <input type="text" name="photo" placeholder="গুগল ড্রাইভ বা ইমেজ লিংক দিন" required>
                </div>

                <!-- শিক্ষাগত যোগ্যতা -->
                <div class="form-group full-width">
                    <label><i class="fa-solid fa-graduation-cap"></i> শিক্ষাগত যোগ্যতা</label>
                    <textarea name="qualification" placeholder="যেমন: B.Sc & M.Sc in CSE, Comilla University" required></textarea>
                </div>

                <!-- স্থায়ী ঠিকানা -->
                <div class="form-group full-width">
                    <label><i class="fa-solid fa-location-dot"></i> স্থায়ী ঠিকানা</label>
                    <textarea name="address" placeholder="গ্রাম/মহল্লা, ডাকঘর, উপজেলা, জেলা" required></textarea>
                </div>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                <i class="fa-solid fa-floppy-disk"></i> তথ্য জমা দিন
            </button>
        </form>
    </div>

    <script>
        // Updated SheetDB API Endpoint
        const sheetDB_API = "https://sheetdb.io/api/v1/w1ctzdyy2dxt4";

        document.getElementById('teacherForm').addEventListener('submit', function(e) {
            e.preventDefault(); 

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> জমা হচ্ছে...';
            submitBtn.disabled = true;

            const formData = new FormData(this);
            
            const data = {
                data: [{
                    "name": formData.get("name"),
                    "fathername": formData.get("fathername"),
                    "dob": formData.get("dob"),
                    "joiningdate": formData.get("joiningdate"),
                    "department": formData.get("department"),
                    "whatsapp": formData.get("whatsapp"),
                    "classteacher": formData.get("classteacher"),
                    "photo": formData.get("photo"),
                    "qualification": formData.get("qualification"),
                    "address": formData.get("address")
                }]
            };

            fetch(sheetDB_API, {
                method: 'POST',
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(result => {
                alert('তথ্য সফলভাবে গুগল শিটে জমা হয়েছে!');
                this.reset(); 
                submitBtn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> তথ্য জমা দিন';
                submitBtn.disabled = false;
            })
            .catch(error => {
                console.error('Error:', error);
                alert('দুঃখিত, ডেটা জমা করতে সমস্যা হয়েছে। আবার চেষ্টা করুন।');
                submitBtn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> তথ্য জমা দিন';
                submitBtn.disabled = false;
            });
        });
    </script>

</body>
</html>
