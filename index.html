<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>১০ম শ্রেণী টিউটোরিয়াল প্রস্তুতি - বিজ্ঞান</title>
    <style>
        :root {
            --primary-color: #4A0E4E;
            --secondary-color: #810551;
            --accent-color: #00D2FF;
            --bg-gradient: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-color: #2D3748;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Kalpurush', 'SolaimanLipi', Arial, sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-color);
            min-height: 100vh;
            padding: 20px 10px;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }

        .header {
            text-align: center;
            border-bottom: 3px solid var(--secondary-color);
            padding-bottom: 20px;
            margin-bottom: 25px;
        }

        .header h1 {
            color: var(--primary-color);
            font-size: 24px;
            margin-bottom: 8px;
        }

        .header h2 {
            color: var(--secondary-color);
            font-size: 18px;
            margin-bottom: 12px;
        }

        .meta-info {
            background: linear-gradient(45deg, #ff9a9e, #fecfef);
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            color: #333;
            display: inline-block;
            margin-top: 5px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .sticky-timer {
            position: sticky;
            top: 10px;
            z-index: 100;
            background: #111;
            color: #00ffcc;
            font-size: 20px;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 30px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            border: 2px solid #00ffcc;
        }

        .student-info {
            background: #f0f4f8;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 25px;
            border-left: 5px solid var(--secondary-color);
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            color: #333;
        }

        .input-group input {
            width: 100%;
            padding: 10px 15px;
            border: 2px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: var(--secondary-color);
        }

        .question-card {
            background: #ffffff;
            border: 1px solid #e1e8ed;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.05);
        }

        .question-title {
            font-weight: bold;
            font-size: 17px;
            color: #1a202c;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .option-label {
            display: flex;
            align-items: center;
            background: #f8fafc;
            border: 2px solid #cbd5e1;
            padding: 12px 15px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 15px;
        }

        .option-label:hover {
            background: #e2e8f0;
            border-color: #94a3b8;
        }

        .option-label input {
            margin-right: 10px;
            transform: scale(1.2);
            accent-color: var(--secondary-color);
        }

        .submit-btn {
            display: block;
            width: 100%;
            background: linear-gradient(45deg, #11998e, #38ef7d);
            color: white;
            font-size: 20px;
            font-weight: bold;
            padding: 15px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(56, 239, 125, 0.4);
            transition: 0.3s;
            margin-top: 20px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(56, 239, 125, 0.6);
        }

        #result-section {
            display: none;
            text-align: center;
            background: #f0fdf4;
            border: 2px solid #22c55e;
            border-radius: 15px;
            padding: 25px;
            margin-top: 20px;
        }

        #result-section h2 {
            color: #15803d;
            margin-bottom: 10px;
        }

        .score-display {
            font-size: 28px;
            font-weight: bold;
            color: #166534;
            margin: 15px 0;
        }

        .whatsapp-btn {
            background: #25D366;
            color: white;
            font-size: 18px;
            font-weight: bold;
            padding: 12px 25px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(37, 211, 102, 0.4);
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            margin-top: 15px;
        }

        .whatsapp-btn:hover {
            background: #1da851;
        }

        .correct-opt {
            background: #dcfce7 !important;
            border-color: #22c55e !important;
            color: #15803d !important;
            font-weight: bold;
        }

        .wrong-opt {
            background: #fee2e2 !important;
            border-color: #ef4444 !important;
            color: #991b1b !important;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>১০ম শ্রেণী টিউটোরিয়াল প্রস্তুতি</h1>
        <h2>বিষয়: বিজ্ঞান (দেখতে হলে আলো চাই)</h2>
        <div class="meta-info">
            সার্বিক তত্ত্বাবধানে: সাইফুল ইসলাম | মোবাইল: ০১৬২২১৮৬৮১২
        </div>
    </div>

    <div class="sticky-timer" id="timer-display">
        অবশিষ্ট সময়: ৩০:০০
    </div>

    <form id="quiz-form">
        <div class="student-info">
            <div class="input-group">
                <label for="student-name">শিক্ষার্থীর নাম *</label>
                <input type="text" id="student-name" required placeholder="আপনার নাম লিখুন">
            </div>
            <div class="input-group">
                <label for="student-roll">রোল নম্বর *</label>
                <input type="text" id="student-roll" required placeholder="আপনার রোল নাম্বার লিখুন">
            </div>
        </div>

        <div id="questions-container"></div>

        <button type="button" class="submit-btn" id="submit-btn" onclick="submitQuiz()">পরীক্ষা জমা দিন</button>
    </form>

    <div id="result-section">
        <h2>পরীক্ষার ফলাফল</h2>
        <p id="student-details" style="font-size: 18px; font-weight: bold;"></p>
        <div class="score-display" id="score-text"></div>
        <p id="time-taken-text" style="color: #555;"></p>
        
        <a id="wa-share-link" class="whatsapp-btn" target="_blank">
            রেজাল্ট WhatsApp এ শেয়ার করুন
        </a>
    </div>
</div>

<script>

    {

    {
        q: "৭. বয়স্ক মানুষের স্বাভাবিক চোখের দূর বিন্দু (Far point) কোথায় অবস্থিত?",

    },

        q: "১৯. চোখের পিউপিল অন্ধকার ঘরে কেমন হয়?",

    },
    {
        q: "৩০. কাঁচের প্রতিসরণাঙ্ক 1.5 এবং বায়ুতে আলোর বেগ 3 × 10⁸ m/s হলে কাঁচের মধ্য দিয়ে আলোকের একটি সংকেত 300 km অতিক্রম করতে কত সময় নেবে?",
        options: ["1.5 × 10⁻³ s", "1.0 × 10⁻³ s", "1.5 × 10⁻⁶ s", "2.0 × 10⁻³ s"],
        ans: 0
    }
];

const optionPrefixes = ["(ক)", "(খ)", "(গ)", "(ঘ)"];

function renderQuestions() {
    const container = document.getElementById("questions-container");
    questionsData.forEach((qObj, index) => {
        const card = document.createElement("div");
        card.className = "question-card";
        card.id = `q-card-${index}`;

        let optionsHTML = "";
        qObj.options.forEach((opt, optIndex) => {
            optionsHTML += `
                <label class="option-label" id="opt-label-${index}-${optIndex}">
                    <input type="radio" name="q${index}" value="${optIndex}">
                    <span>${optionPrefixes[optIndex]} ${opt}</span>
                </label>
            `;
        });

        card.innerHTML = `
            <div class="question-title">${qObj.q}</div>
            <div class="options-grid">${optionsHTML}</div>
        `;
        container.appendChild(card);
    });
}

let totalTime = 30 * 60;
let timerInterval;

function startTimer() {
    const timerDisplay = document.getElementById("timer-display");
    timerInterval = setInterval(() => {
        let minutes = Math.floor(totalTime / 60);
        let seconds = totalTime % 60;
        
        minutes = minutes < 10 ? "০" + minutes : convertToBanglaDigits(minutes);
        seconds = seconds < 10 ? "০" + seconds : convertToBanglaDigits(seconds);

        timerDisplay.innerHTML = `অবশিষ্ট সময়: ${minutes}:${seconds}`;

        if (totalTime <= 0) {
            clearInterval(timerInterval);
            alert("আপনার ৩০ মিনিট সময় শেষ হয়ে গেছে! উত্তর অটোমেটিক সাবমিট হচ্ছে।");
            submitQuiz(true);
        }
        totalTime--;
    }, 1000);
}

function convertToBanglaDigits(num) {
    const bnDigits = ['০', '১', '২', '৩', '৪', '৫', '৬', '৭', '৮', '৯'];
    return num.toString().split('').map(d => bnDigits[d] || d).join('');
}

window.onload = function() {
    if (localStorage.getItem("class10_science_quiz_submitted")) {
        document.body.innerHTML = `
            <div class="container" style="text-align:center; padding:50px;">
                <h1 style="color: #e74c3c;">আপনি ইতিমধ্যেই এই পরীক্ষাটি দিয়েছেন!</h1>
                <p style="margin-top:15px; font-size:18px;">একজন শিক্ষার্থী কেবল একবারই এই পরীক্ষায় অংশগ্রহণ করতে পারবে।</p>
            </div>
        `;
        return;
    }
    renderQuestions();
    startTimer();
};

function submitQuiz(isTimeOut = false) {
    const nameInput = document.getElementById("student-name").value.trim();
    const rollInput = document.getElementById("student-roll").value.trim();

    if (!isTimeOut && (!nameInput || !rollInput)) {
        alert("অনুগ্রহ করে আপনার নাম এবং রোল নম্বর লিখুন!");
        return;
    }

    clearInterval(timerInterval);
    localStorage.setItem("class10_science_quiz_submitted", "true");

    let score = 0;
    questionsData.forEach((qObj, index) => {
        const selected = document.querySelector(`input[name="q${index}"]:checked`);
        const inputs = document.querySelectorAll(`input[name="q${index}"]`);
        inputs.forEach(input => input.disabled = true);

        if (selected) {
            const userAns = parseInt(selected.value);
            if (userAns === qObj.ans) {
                score++;
                document.getElementById(`opt-label-${index}-${userAns}`).classList.add("correct-opt");
            } else {
                document.getElementById(`opt-label-${index}-${userAns}`).classList.add("wrong-opt");
                document.getElementById(`opt-label-${index}-${qObj.ans}`).classList.add("correct-opt");
            }
        } else {
            document.getElementById(`opt-label-${index}-${qObj.ans}`).classList.add("correct-opt");
        }
    });

    document.getElementById("submit-btn").style.display = "none";
    document.getElementById("timer-display").style.display = "none";

    const resultSection = document.getElementById("result-section");
    resultSection.style.display = "block";

    document.getElementById("student-details").innerText = `শিক্ষার্থী: ${nameInput || 'অজ্ঞাত'} | রোল: ${rollInput || 'N/A'}`;
    document.getElementById("score-text").innerText = `প্রাপ্ত নম্বর: ${convertToBanglaDigits(score)} / ৩০`;
    
    let timeSpentSeconds = (30 * 60) - totalTime;
    let spentMin = Math.floor(timeSpentSeconds / 60);
    let spentSec = timeSpentSeconds % 60;
    document.getElementById("time-taken-text").innerText = `সময় লেগেছে: ${convertToBanglaDigits(spentMin)} মিনিট ${convertToBanglaDigits(spentSec)} সেকেন্ড`;

    const waNumber = "8801622186812";
    const msg = `১০ম শ্রেণী টিউটোরিয়াল প্রস্তুতি (বিজ্ঞান - দেখতে হলে আলো চাই)\n` +
                `নাম: ${nameInput}\n` +
                `রোল: ${rollInput}\n` +
                `প্রাপ্ত নম্বর: ${score}/৩০`;
    
    const waUrl = `https://api.whatsapp.com/send?phone=${waNumber}&text=${encodeURIComponent(msg)}`;
    document.getElementById("wa-share-link").href = waUrl;

    resultSection.scrollIntoView({ behavior: 'smooth' });
}
</script>
